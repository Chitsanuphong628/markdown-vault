<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#09090b">
    <meta name="color-scheme" content="dark">
    <link rel="icon" href="/icon-192x192.png" type="image/png">
    <title>ไม่มีอินเทอร์เน็ต · Nota</title>
    <style>
      :root { color-scheme: dark; font-family: Arial, Helvetica, sans-serif; background: #09090b; color: #f4f4f5; }
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; margin: 0; padding: 24px; place-items: center; }
      main { width: min(100%, 420px); text-align: center; }
      img { width: 56px; height: 56px; margin-bottom: 20px; }
      h1 { margin: 0; font-size: 1.5rem; line-height: 1.3; }
      p { margin: 12px 0 24px; color: #a1a1aa; line-height: 1.6; }
      button { min-height: 44px; padding: 0 18px; border: 0; border-radius: 8px; background: #4f46e5; color: white; font: inherit; font-weight: 600; cursor: pointer; }
      button:focus-visible { outline: 2px solid #a5b4fc; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192x192.png" width="56" height="56" alt="Nota">
      <h1 id="offline-title">ไม่มีอินเทอร์เน็ต</h1>
      <p id="offline-message">เชื่อมต่ออินเทอร์เน็ตเพื่อเปิดโน้ตและบันทึกการเปลี่ยนแปลง</p>
      <button id="retry" type="button">ลองอีกครั้ง</button>
    </main>
    <script>
      const copy = {
        th: {
          title: "ไม่มีอินเทอร์เน็ต",
          message: "เชื่อมต่ออินเทอร์เน็ตเพื่อเปิดโน้ตและบันทึกการเปลี่ยนแปลง",
          retry: "ลองอีกครั้ง",
          documentTitle: "ไม่มีอินเทอร์เน็ต · Nota",
        },
        en: {
          title: "You’re offline",
          message: "Connect to the internet to open notes and save changes.",
          retry: "Try again",
          documentTitle: "You’re offline · Nota",
        },
      };
      let language = "th";
      try { language = localStorage.getItem("nota_lang") === "en" ? "en" : "th"; } catch {}
      const selectedCopy = copy[language];
      document.documentElement.lang = language;
      document.title = selectedCopy.documentTitle;
      document.getElementById("offline-title").textContent = selectedCopy.title;
      document.getElementById("offline-message").textContent = selectedCopy.message;
      document.getElementById("retry").textContent = selectedCopy.retry;
      document.getElementById("retry").addEventListener("click", () => window.location.reload());
    </script>
  </body>
</html>
